<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redodc - Renderización Dinámica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#" onclick="renderizarInicio()">Redodc</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav" id="menuCategorias"></ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal -->
    <div class="container mt-4" id="contenido">
        <h2>Bienvenido a Redodc</h2>
        <p>Selecciona una categoría para ver más contenido.</p>
    </div>

    <script>
        // Definimos las categorías y sus subcategorías
        const categorias = [
            {
                nombre: "Proyectos",
                subcategorias: [
                    { nombre: "Software", descripcion: "Desarrollo de software y aplicaciones." },
                    { nombre: "Hardware", descripcion: "Proyectos de dispositivos electrónicos." },
                    { nombre: "Mecánica", descripcion: "Construcción y automatización de estructuras mecánicas." }
                ]
            },
            {
                nombre: "Electrónica",
                subcategorias: [
                    { nombre: "Electrónica Analógica", descripcion: "Circuitos con resistencias, capacitores y transistores." },
                    { nombre: "Electrónica de Control", descripcion: "Automatización y sistemas de control industrial." },
                    { nombre: "Electrónica de Potencia", descripcion: "Conversión de energía y sistemas de alta potencia." }
                ]
            },
            {
                nombre: "Videojuegos Retro",
                subcategorias: [
                    { nombre: "Consolas Clásicas", descripcion: "Historia y curiosidades de consolas antiguas." },
                    { nombre: "Arcades", descripcion: "Máquinas recreativas y su evolución." },
                    { nombre: "Homebrew", descripcion: "Desarrollo de juegos retro por la comunidad." }
                ]
            }
        ];

        // Renderiza el menú de navegación
        function renderizarMenu() {
            const menu = document.getElementById("menuCategorias");
            menu.innerHTML = ""; // Limpiar menú antes de agregar elementos

            categorias.forEach((categoria, index) => {
                let li = document.createElement("li");
                li.classList.add("nav-item");

                let a = document.createElement("a");
                a.classList.add("nav-link");
                a.href = "#";
                a.textContent = categoria.nombre;
                a.dataset.index = index; // Guardamos el índice

                // Evento de clic para renderizar contenido
                a.addEventListener("click", (event) => {
                    event.preventDefault();
                    renderizarSubcategorias(event.target.dataset.index);
                });

                li.appendChild(a);
                menu.appendChild(li);
            });
        }

        // Renderiza las subcategorías al hacer clic en una categoría
        function renderizarSubcategorias(index) {
            const contenido = document.getElementById("contenido");
            const categoria = categorias[index];

            // Construimos el HTML dinámico
            let html = `
                <h2>${categoria.nombre}</h2>
                <div class="row mt-4">
            `;

            categoria.subcategorias.forEach(sub => {
                html += `
                    <div class="col-md-4">
                        <div class="card shadow-sm mb-4">
                            <div class="card-body">
                                <h5 class="card-title">${sub.nombre}</h5>
                                <p class="card-text">${sub.descripcion}</p>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`; // Cerramos la fila

            // Insertamos el nuevo contenido en el body
            contenido.innerHTML = html;
        }

        // Renderiza el contenido inicial de la página
        function renderizarInicio() {
            const contenido = document.getElementById("contenido");
            contenido.innerHTML = `
                <h2>Bienvenido a Redodc</h2>
                <p>Selecciona una categoría para ver más contenido.</p>
            `;
        }

        // Llamamos a la función para renderizar el menú al cargar la página
        renderizarMenu();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
