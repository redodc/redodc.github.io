<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redodc - Renderización Dinámica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8e8e8;
            text-align: center;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .navbar, .footer {
            background-color: #343a40;
            color: white;
        }
        .content-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            flex-grow: 1;
        }
        .card img {
            max-height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }
        .footer {
            position: relative;
            bottom: 0;
            width: 100%;
            text-align: center;
        }
        .home-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f1f1;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .home-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 10px;
        }
        .home-text {
            flex-grow: 1;
            text-align: left;
            padding-right: 10px;
        }
    </style>
</head>
<body>
    
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#" onclick="renderizarHome()">Redodc</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto" id="menuCategorias"></ul>
            </div>
        </div>
    </nav>
    
    <!-- Contenido -->
    <div class="container content-container" id="contenido"></div>
    
    <!-- Footer -->
    <footer class="footer py-3 mt-4">
        <p id="footer-text">Contenido generado por Redodc</p>
    </footer>
    
    <script>
        document.getElementById("footer-text").innerText += " - " + new Date().getFullYear();

        const contenidoHome = [
            { fecha: "2025-02-13", texto: "Bienvenido a Redodc, un espacio para compartir sobre electrónica y videojuegos retro.", imagen: "https://via.placeholder.com/50" }
        ];

        const categorias = [
            { nombre: "Proyectos", subcategorias: ["Sistemas embebidos","Automatización industrial"] },
            { nombre: "Electrónica", subcategorias: ["Electrónica Analógica", "Electrónica de Control", "Electrónica de Potencia"] },
            { nombre: "Videojuegos Retro", subcategorias: ["Consolas Clásicas", "Arcades Retro", "Desarrollo Homebrew"] }
        ];

        function renderizarHome() {
            const contenido = document.getElementById("contenido");
            let html = `<h2>Novedades</h2>`;
            contenidoHome.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
            contenidoHome.forEach(entry => {
                html += `
                    <div class='home-item'>
                        <div class='home-text'>
                            <p>${entry.texto}</p>
                            <small>${entry.fecha}</small>
                        </div>
                        <img src='${entry.imagen}' alt='Imagen'>
                    </div>
                `;
            });
            contenido.innerHTML = html;
        }

        function cargarCategorias() {
            const menu = document.getElementById("menuCategorias");
            categorias.forEach(cat => {
                let item = document.createElement("li");
                item.classList.add("nav-item");
                let link = document.createElement("a");
                link.classList.add("nav-link");
                link.href = "#";
                link.innerText = cat.nombre;
                link.onclick = () => renderizarCategoria(cat);
                item.appendChild(link);
                menu.appendChild(item);
            });
        }

        function renderizarCategoria(categoria) {
            const contenido = document.getElementById("contenido");
            let html = `<h2>${categoria.nombre}</h2>`;
            categoria.subcategorias.forEach(sub => {
                html += `<div class='home-item'><div class='home-text'><p>${sub}</p></div></div>`;
            });
            contenido.innerHTML = html;
        }

        cargarCategorias();
        renderizarHome();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
