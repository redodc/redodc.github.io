<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redodc - Renderización Dinámica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8e8e8;
            text-align: center;
        }
        .navbar, .footer {
            background-color: #343a40;
            color: white;
        }
        .content-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        .card img {
            max-height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#" onclick="renderizarInicio()">Redodc</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto" id="menuCategorias"></ul>
            </div>
        </div>
    </nav>
    
    <!-- Contenido -->
    <div class="container content-container" id="contenido">
        <h2>Bienvenido a Redodc</h2>
        <p>Selecciona una categoría para ver más contenido.</p>
    </div>
    
    <!-- Footer -->
    <footer class="footer py-3 mt-4">
        <p id="footer-text">Contenido generado por Redodc</p>
    </footer>
    
    <script>
        document.getElementById("footer-text").innerText += " - " + new Date().getFullYear();

        const categorias = [
            {
                nombre: "Electrónica",
                subcategorias: [
                    { nombre: "Electrónica Analógica", descripcion: "Circuitos clásicos con resistencias y capacitores.", imagen: "analogica.png" },
                    { nombre: "Electrónica de Control", descripcion: "Automatización y control industrial.", imagen: "control.png" },
                    { nombre: "Electrónica de Potencia", descripcion: "Sistemas de alta potencia y conversión de energía.", imagen: "potencia.png" }
                ]
            },
            {
                nombre: "Videojuegos Retro",
                subcategorias: [
                    { nombre: "Consolas Clásicas", descripcion: "Historia de las consolas de antaño.", imagen: "consolas.png" },
                    { nombre: "Arcades", descripcion: "Las legendarias máquinas recreativas.", imagen: "arcades.png" },
                    { nombre: "Homebrew", descripcion: "Desarrollo de juegos por la comunidad.", imagen: "homebrew.png" }
                ]
            }
        ];

        function renderizarMenu() {
            const menu = document.getElementById("menuCategorias");
            menu.innerHTML = "";
            categorias.forEach((categoria, index) => {
                let li = document.createElement("li");
                li.classList.add("nav-item");

                let a = document.createElement("a");
                a.classList.add("nav-link");
                a.href = "#";
                a.textContent = categoria.nombre;
                a.dataset.index = index;
                a.addEventListener("click", (event) => {
                    event.preventDefault();
                    renderizarSubcategorias(event.target.dataset.index);
                });

                li.appendChild(a);
                menu.appendChild(li);
            });
        }

        function renderizarSubcategorias(index) {
            const contenido = document.getElementById("contenido");
            const categoria = categorias[index];
            let html = `<h2>${categoria.nombre}</h2><div class='row mt-4'>`;
            categoria.subcategorias.forEach(sub => {
                html += `
                    <div class='col-md-4'>
                        <div class='card shadow-sm mb-4'>
                            <img src='${sub.imagen}' class='card-img-top' alt='${sub.nombre}'>
                            <div class='card-body'>
                                <h5 class='card-title'>${sub.nombre}</h5>
                                <p class='card-text'>${sub.descripcion}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            contenido.innerHTML = html;
        }

        function renderizarInicio() {
            document.getElementById("contenido").innerHTML = `
                <h2>Bienvenido a Redodc</h2>
                <p>Selecciona una categoría para ver más contenido.</p>
            `;
        }

        renderizarMenu();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
